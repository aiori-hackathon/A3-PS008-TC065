frr defaults traditional
hostname R1
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.12.1/30
exit
!
interface eth2
 ip address 10.0.13.1/30
exit
!
interface lo
 ip address 10.10.10.1/24
exit
!
ip route 10.10.20.0/24 10.0.12.2
ip route 10.10.30.0/24 10.0.13.2
! legacy detour: upper half of R3 LAN goes via R2 (safe to remove)
ip route 10.10.30.128/25 10.0.12.2
!
end
