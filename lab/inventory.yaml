# Single source of truth for the lab. No IPs are hard-coded in Python.
lab: nma            # containerlab lab name -> containers are clab-nma-<node>
routers:
  R1:
    node: r1
    lan_ip: 10.10.10.1          # used as ping source in health checks
    interfaces:
      eth1: 10.0.12.1/30        # to R2
      eth2: 10.0.13.1/30        # to R3
      lo: [10.10.10.1/24]       # R1 LAN
  R2:
    node: r2
    lan_ip: 10.10.20.1
    interfaces:
      eth1: 10.0.12.2/30        # to R1
      eth2: 10.0.23.1/30        # to R3
      lo: [10.10.20.1/24]       # R2 LAN
  R3:
    node: r3
    lan_ip: 10.10.30.1
    interfaces:
      eth1: 10.0.23.2/30        # to R2
      eth2: 10.0.13.2/30        # to R1
      lo: [10.10.30.1/24, 10.10.31.1/24]   # R3 LAN + R3 server LAN (not routed yet)
